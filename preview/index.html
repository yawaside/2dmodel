<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live2D model preview</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background:#15171c; color:#e8eaf0; display:flex; height:100vh; overflow:hidden; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; position:relative;
           background:
             linear-gradient(45deg,#191c22 25%,transparent 25%,transparent 75%,#191c22 75%),
             linear-gradient(45deg,#191c22 25%,#12141a 25%,#12141a 75%,#191c22 75%);
           background-size:32px 32px; background-position:0 0,16px 16px; }
  canvas { max-width:100%; max-height:100%; }
  #panel { width:320px; padding:16px 18px; box-sizing:border-box; overflow-y:auto;
           background:#1c1f26; border-left:1px solid #2a2e38; }
  h1 { font-size:15px; margin:0 0 4px; }
  .sub { color:#8b93a7; font-size:12px; margin-bottom:14px; }
  .row { margin-bottom:9px; }
  label { display:flex; justify-content:space-between; font-size:12px; color:#aeb6c8; }
  input[type=range] { width:100%; margin:2px 0 0; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 14px; }
  button { background:#2b3040; color:#e8eaf0; border:1px solid #39405233; border-radius:6px;
           padding:5px 9px; font-size:12px; cursor:pointer; }
  button:hover { background:#343b4e; }
  .hint { color:#7d8598; font-size:11px; margin-top:14px; }
  #fps { position:absolute; top:8px; left:10px; color:#5c6478; font-size:11px; }
  .err { color:#ff8080; white-space:pre-wrap; font-family:ui-monospace,monospace; font-size:11px; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="620" height="620"></canvas><div id="fps"></div></div>
<div id="panel">
  <h1>Предпросмотр модели</h1>
  <div class="sub" id="status">загрузка…</div>
  <div class="btns">
    <button data-pose="reset">Сброс</button>
    <button data-pose="blink">Моргнуть</button>
    <button data-pose="talk">Рот</button>
    <button id="auto">Авто-движение: выкл</button>
    <button id="mouse">Следовать за мышью: вкл</button>
  </div>
  <div id="sliders"></div>
  <div class="hint">
    Ползунки дублируют параметры, которые VTube Studio передаёт в модель.
    Каталог готового комплекта: <code>dist/ChibiVT</code>.
  </div>
  <div id="err" class="err"></div>
</div>
<script src="lib/live2dcubismcore.min.js"></script>
<script src="app.js"></script>
</body>
</html>
